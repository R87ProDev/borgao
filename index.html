<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Rodeio</title>
    <link rel="icon" type="image/png" href="./assets/images/data_logo.png"/>
    <link rel="shortcut icon" href="./assets/images/data_logo.png" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="./assets/images/data_logo.png">
    <link rel="icon" type="image/x-icon" href="./assets/images/data_logo.png">
    <link rel="icon" href="./assets/images/data_logo.png" />

    <link href="./library/bootstrap/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->
</head>

<body>
    <header class="d-flex align-items-center justify-content-between p-4">
        <div class="d-flex align-items-center justify-content-between">
            <img id="fullScreen" src="./assets/images/data_logo.png" width="30px" alt="">
            <span class="d-flex align-items-center"> 
                <div class="circle"></div> 
                <p class="fs-5 fw-semibold status">Desconectado</p> 
            </span>
        </div>
        <div class="fs-4 fw-semibold judge"></div>
    </header>

    <main>
        <div class="d-flex  justify-content-between">
            <div class="">
            <p class="fs-1 fw-semibold">Competidor:</p>
            <span class="fs-4" id="nameCompetitor"></span>
            <p class="fs-1 fw-semibold">Animal:</p>
            <span class="fs-4">
                <span id="nameAnimal"></span>
            <span id="nameContractor"></span>
            </span>
        </div>
        <div >
            <p class="time-ride p-4 fw-bolder fs-1 mt-3"></p>
        </div>

        </div>

        <div class="clock-template mt-5">
            <button class="btn btn-danger fw-bolder btn-clock">CLOCK</button> <br>
           <!--  <button class="btn fw-bolder btn-warning btn-declassify mt-4" data-bs-toggle="modal" data-bs-target="#staticBackdrop">DESCLASSIFICAR</button> -->
        </div>

        <div class="text-center fs-1 fw-bolder ride-warning mt-4">Aguardando Montaria...</div>

        <div class="data-note-template mt-4">
            <div class="d-flex gap-4">
                <div class="mb-3 w-100" style="height:120px;position: relative;">
                    <label for="animal" class="form-label fw-semibold fs-4">Animal</label>
                    <input type="text" class="form-control input-data fw-bolder" id="animal" placeholder="Nota">
                    <div onclick="cleanInput('animal')">
                      <img src="./assets/images/x.svg" class="clean-input-button clear-animal"alt="">
                    </div>
                </div>
                <div class="mb-3 w-100" style="height:120px;position: relative;">
                    <label for="competitor" class="form-label fw-semibold fs-4">Competidor</label>
                    <input disabled type="text" class="form-control input-data fw-bolder" id="competitor" placeholder="Nota">
                    <span onclick="cleanInput('competitor')">
                        <img src="./assets/images/x.svg" class="clean-input-button  clear-competitor" alt="">
                    </span>
                </div>
            </div>

            <div class="data-number mt-5">
                <div class="row gap-1">
                    <div class="col">
                        <button id="number-1" class="button-number fw-bolder btn-primary" onclick="dataNumber('1')">1</button>
                    </div>
                    <div class="col">
                        <button id="number-2" class="button-number fw-bolder btn-primary" onclick="dataNumber('2')">2</button>
                    </div>
                    <div class="col">
                        <button id="number-3" class="button-number fw-bolder btn-primary" onclick="dataNumber('3')">3</button>
                    </div>
                </div>
                <div class="row gap-1 mt-3">
                    <div class="col">
                        <button id="number-4" class="button-number fw-bolder btn-primary" onclick="dataNumber('4')">4</button>
                    </div>
                    <div class="col">
                        <button id="number-5" class="button-number fw-bolder btn-primary" onclick="dataNumber('5')">5</button>
                    </div>
                    <div class="col">
                        <button id="number-6" class="button-number fw-bolder btn-primary" onclick="dataNumber('6')">6</button>
                    </div>
                </div>
                <div class="row gap-1 mt-3">
                    <div class="col">
                        <button id="number-7" class="button-number fw-bolder btn-primary" onclick="dataNumber('7')">7</button>
                    </div>
                    <div class="col">
                        <button id="number-8" class="button-number fw-bolder btn-primary" onclick="dataNumber('8')">8</button>
                    </div>
                    <div class="col">
                        <button id="number-9" class="button-number fw-bolder btn-primary" onclick="dataNumber('9')">9</button>
                    </div>
                </div>
                <div class="row gap-1 mt-3">
                    <div class="col"></div>
                    <div class="col">
                        <button id="number-0" class="button-number fw-bolder btn-primary" onclick="dataNumber('0')">0</button>
                    </div>
                    <div class="col"></div>
                </div>
                <div class="row gap-1 mt-3">
                    <div class="col">
                        <button id="number-25" class="button-number btn-warning fw-bolder" onclick="dataNumber('25')">.25</button>
                    </div>
                    <div class="col">
                        <button id="number-50" class="button-number btn-warning fw-bolder" onclick="dataNumber('50')">.50</button>
                    </div>
                    <div class="col">
                        <button id="number-75" class="button-number btn-warning fw-bolder" onclick="dataNumber('75')">.75</button>
                    </div>
                </div>

            </div>
            <button id="btn-save" class="btn btn-success fs-2 fw-bolder w-100 mt-3">ENVIAR</button>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop"  data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="staticBackdropLabel">Qual o motivo do desclassificação ?</h5>
                </div>
                <div class="modal-body">
                    <div class="form-floating">
                        <select class="form-select" id="declassifySelect">
                        <option value="1">Animal desclassificado</option>
                        <option value="2">Competidor desclassificado</option>
                        <option value="3">Baixo desempenho</option>
                    </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" data-bs-dismiss="modal" aria-label="Close" class="btn fw-bolder w-100 btn-confirm-declassify">CONFIRMAR</button>
                </div>
            </div>
        </div>
    </div>


    <script src="./library/bootstrap/bootstrap.bundle.min.js" ></script>
    <script src="./library/jquery/jquery-3.6.0.js"></script>
    <script src="./assets/js/script.js"></script>

</body>

</html>
